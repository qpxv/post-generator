name: nightly-post

on:
  # 01:05 UTC = 03:05 CEST (matches the local overnight run time during summer).
  # Off by ~1h during CET/winter (Berlin is UTC+1 then) - fine for a summer trip,
  # bump the hour by 1 if this still runs into winter.
  schedule:
    - cron: "5 1 * * *"
  workflow_dispatch:

# The learning steps commit their data back so tomorrow's run builds on it
permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm ci

      # Learning steps never block posting: a failure here just means tonight's
      # batch uses yesterday's guidance
      - name: collect post stats
        continue-on-error: true
        run: npm run collect
        env:
          TYPEFULLY_API_KEY: ${{ secrets.TYPEFULLY_API_KEY }}

      - name: tag new posts
        continue-on-error: true
        run: npm run tag
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: learn from results
        continue-on-error: true
        run: npm run learn

      - name: fetch journal entry
        id: journal
        run: |
          DATE=$(TZ=Europe/Berlin date -d yesterday +%Y-%m-%d)
          LABEL=$(TZ=Europe/Berlin date -d yesterday +"%B %-d" | tr '[:upper:]' '[:lower:]')
          mkdir -p journal-tmp
          URL="https://journal-app-xi-beryl.vercel.app/api/entries/export?date=$DATE&tz=Europe%2FBerlin"
          HTTP_STATUS=$(curl -s -o "journal-tmp/$LABEL.txt" -w "%{http_code}" "$URL")
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "journal export failed with status $HTTP_STATUS, skipping post"
            rm -f "journal-tmp/$LABEL.txt"
            exit 1
          fi
          echo "journal_dir=$PWD/journal-tmp" >> "$GITHUB_OUTPUT"

      - name: generate and post
        run: npm run post
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TYPEFULLY_API_KEY: ${{ secrets.TYPEFULLY_API_KEY }}
          JOURNAL_DIR: ${{ steps.journal.outputs.journal_dir }}

      # Runs even when the journal fetch fails, so collected stats are never lost
      - name: commit learning data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/performance data/learned
          git diff --cached --quiet && exit 0
          git commit -m "chore: update post performance data"
          git pull --rebase
          git push
